; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Tanpa ini, "pio run" akan membangun semua env sekaligus.
default_envs = lingo001

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash 16MB
board_upload.flash_size = 16MB
; Partition untuk flash besar
board_build.partitions = default_16MB.csv

; PSRAM 8MB
board_build.psram_type = opi
; ESP32-S3 N16R8: 16MB flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DEI_MAX_OVERFLOW_BUFFER_COUNT=96
    ; 1 = per-stage heap integrity diagnostics, 0 = normal runtime
    -DLINGO_EI_HEAP_DIAGNOSTICS=0
    ; Uji A/B: disable ESP-NN optimized kernels. Gunakan TFLite reference kernels.
    ; Jika heap corruption pada CONV_2D op=57 hilang, periksa kompatibilitas ESP-NN.
    -DEI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 0 = langsung mode offline, 1 = aktifkan koneksi WiFi
    -DLINGO_WIFI_ENABLED=1

lib_deps =
    tzapu/WiFiManager
    bblanchon/ArduinoJson
    DFRobot/DFRobotDFPlayerMini
    https://github.com/bitbank2/BitBang_I2C.git

; =========================================================
; PILIH ENV SESUAI ALAT
;   lingo001 / lingo002          -> upload lewat kabel USB
;   lingo001-ota / lingo002-ota  -> upload lewat WiFi (OTA)
; Lihat PANDUAN-OTA.md untuk langkah lengkapnya.
; =========================================================

[env:lingo001]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DLINGO_DEVICE_ID_STR=\"LINGO001\"

[env:lingo002]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DLINGO_DEVICE_ID_STR=\"LINGO002\"

; OTA: LINGO harus menyala dan terhubung ke WiFi yang sama dengan laptop.
; --auth harus sama dengan LINGO_OTA_PASSWORD di src/main.cpp.
[env:lingo001-ota]
extends = env:lingo001
upload_protocol = espota
upload_port = lingo001.local
upload_flags =
    --auth=lingo-ota-2026

[env:lingo002-ota]
extends = env:lingo002
upload_protocol = espota
upload_port = lingo002.local
upload_flags =
    --auth=lingo-ota-2026
